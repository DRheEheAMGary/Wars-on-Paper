<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Wars on Paper — 网页端实时领土争夺游戏" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>Wars on Paper</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Cpath d='M18 74 L42 24 L54 56 L82 30 L72 78 Z' fill='%23e0492f'/%3E%3C/svg%3E"

    <link rel="stylesheet" href="/src/client/styles/main.css" />

  <body>
    <main id="app" class="screen">
      <div class="column">
        <header class="hero">
          <h1>
            <span class="title-zh">纸上谈兵</span>
            <span class="title-sep">|</span>
            <span class="title-en">Wars on Paper</span>

          <p class="tagline">
            占领城市，吞并领土，在 12 分钟内成为最后的赢家。
          </p>
        </header>

        <nav class="menu" aria-label="主菜单">
          <button class="menu-item" type="button" data-action="single">
            <span class="menu-index">01</span>
            <span class="menu-label">单人游戏</span>
            <span class="menu-note">进入</span>

          <button class="menu-item" type="button" data-action="tutorial">

            <span class="menu-label">教程模式</span>
            <span class="menu-note">7 步上手</span>

            <span class="menu-index">03</span>
            <span class="menu-label">多人乱斗</span>
            <span class="menu-note">进入</span>
          </button>
          <button class="menu-item" type="button" data-action="help">
            <span class="menu-index">04</span>
            <span class="menu-label">玩法说明</span>
            <span class="menu-note">查看</span>
          </button>
        </nav>

        <p id="notice" class="notice" role="status" aria-live="polite"></p>

    <script type="module" src="/src/client/main.js"></script>
