<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Wars on Paper — 单人游戏设置" />
    <meta name="color-scheme" content="light" />
    <title>单人游戏设置 · Wars on Paper</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Cpath d='M18 74 L42 24 L54 56 L82 30 L72 78 Z' fill='%23e0492f'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/client/styles/main.css" />
    <link rel="stylesheet" href="/src/client/styles/setup.css" />
  </head>
  <body>
    <main class="screen setup-screen">
      <div class="column setup-column">
        <a class="setup-back" href="/">← 返回主菜单</a>
        <p class="setup-kicker">单人游戏</p>
        <h1 class="setup-title">开始一局</h1>
        <p class="tagline">选择地图规模、AI 对手与难度，然后开战。</p>

        <form id="setup-form" class="setup-form">
          <div class="setup-row">
            <label for="setup-seed">地图种子</label>
            <div class="setup-control">
              <input id="setup-seed" name="seed" type="number" min="0" step="1" inputmode="numeric" />
              <button id="setup-random-seed" class="setup-inline-button" type="button">随机</button>
            </div>
          </div>

          <div class="setup-row">
            <label for="setup-scenario">剧本</label>
            <div class="setup-control">
              <select id="setup-scenario" name="scenario"></select>
            </div>
          </div>

          <div class="setup-row">
            <label for="setup-mode">模式</label>
            <div class="setup-control">
              <select id="setup-mode" name="mode">
                <option value="timed">限时争霸</option>
                <option value="endless">无尽模式</option>
              </select>
            </div>
          </div>

          <div class="setup-row">
            <label for="setup-cities">城市数</label>
            <div class="setup-control">
              <select id="setup-cities" name="cities"></select>
            </div>
          </div>

          <div class="setup-row">
            <label for="setup-ai">AI 对手</label>
            <div class="setup-control">
              <select id="setup-ai" name="ai"></select>
            </div>
          </div>

          <div class="setup-row">
            <span class="setup-label">难度</span>
            <div class="setup-control setup-segmented" id="setup-difficulty"></div>
          </div>

          <div class="setup-row">
            <label for="setup-minutes">对局时长</label>
            <div class="setup-control">
              <select id="setup-minutes" name="minutes"></select>
            </div>
          </div>

          <button class="setup-start" type="submit">开始对局</button>
        </form>

        <p class="setup-note">
          单击城市选中，左侧「派兵数量」滑条决定这次派多少兵，按住城市拖到目标城市派兵。
        </p>
        <p class="setup-note setup-note-muted">
          拖到自己的城市可跨任意距离调兵；攻击中立/敌方城市仅限相邻或渡海。
        </p>
      </div>
    </main>

    <script type="module" src="/src/client/setup.js"></script>
  </body>
</html>
